<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Civil Engineering Schedule | Sophomore Section 1 | Ain Shams University</title>
  <meta name="description" content="Interactive cinematic study schedule for Civil Engineering Sophomore Section 1 at Ain Shams University Faculty of Engineering." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cairo:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            nearblack: '#050505',
            charcoal: '#111111',
            darkgray: '#242424',
            warmyellow: '#FFD166',
            goldenamber: '#F5B642',
            warmwhite: '#FFF4D6',
          },
          fontFamily: {
            inter: ['Inter', 'sans-serif'],
            manrope: ['Manrope', 'sans-serif'],
            cairo: ['Cairo', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --near-black: #050505;
      --charcoal: #111111;
      --dark-gray: #242424;
      --warm-yellow: #FFD166;
      --golden-amber: #F5B642;
      --warm-white: #FFF4D6;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--near-black);
      color: var(--warm-white);
      font-family: 'Inter', system-ui, sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #111; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #F5B642; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    .blueprint-bg {
      background-image:
        linear-gradient(rgba(245, 182, 66, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(245, 182, 66, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .dust {
      position: absolute;
      width: 2px; height: 2px;
      background: rgba(255, 244, 214, 0.4);
      border-radius: 50%;
      pointer-events: none;
      animation: float 8s infinite ease-in-out;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) translateX(0); opacity: 0.2; }
      50% { transform: translateY(-30px) translateX(10px); opacity: 0.6; }
    }

    .bulb-glass {
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.12), transparent 60%),
                  radial-gradient(ellipse at center, #1a1a1a 0%, #0a0a0a 70%);
      box-shadow: inset 0 0 20px rgba(255,255,255,0.04);
    }
    .bulb-on {
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.95), rgba(255,209,102,0.85) 40%, rgba(245,182,66,0.65) 70%);
      box-shadow: 0 0 50px 15px rgba(255,209,102,0.55), 0 0 100px 30px rgba(245,182,66,0.25), inset 0 0 25px rgba(255,255,255,0.45);
    }

    .cord {
      background: linear-gradient(to right, #2a2a2a, #555, #2a2a2a);
      border-radius: 2px;
    }
    .cord-handle {
      background: linear-gradient(145deg, #3a3a3a, #1a1a1a);
      box-shadow: 0 2px 8px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.08);
    }

    .card-struct { border-left: 3px solid #F5B642; }
    .card-materials { border-left: 3px solid #E8A838; }
    .card-lab { border-left: 3px solid #7EB8DA; }
    .card-math { border-left: 3px solid #A78BFA; }
    .card-survey { border-left: 3px solid #34D399; }
    .card-hydro { border-left: 3px solid #60A5FA; }
    .card-fluid { border-left: 3px solid #38BDF8; }
    .card-drawing { border-left: 3px solid #F472B6; }

    .text-glow { text-shadow: 0 0 12px rgba(245, 182, 66, 0.45); }

    @keyframes pulse-glow {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 0.65; }
    }
    .pulse-glow { animation: pulse-glow 2s ease-in-out infinite; }

    @keyframes flicker {
      0%, 100% { opacity: 1; }
      8% { opacity: 0.25; }
      16% { opacity: 0.9; }
      24% { opacity: 0.4; }
      32% { opacity: 1; }
      40% { opacity: 0.6; }
      48% { opacity: 1; }
    }
    .flicker { animation: flicker 0.55s ease-in-out; }

    @keyframes swing {
      0%, 100% { transform: rotate(-1.8deg); }
      50% { transform: rotate(1.8deg); }
    }
    .swing { animation: swing 3.2s ease-in-out infinite; transform-origin: top center; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in-up { animation: fadeInUp 0.7s ease-out forwards; }

    @keyframes revealLight {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .reveal-light { animation: revealLight 1.1s ease-out forwards; }

    .instruction-pulse {
      animation: pulse-glow 2.4s ease-in-out infinite;
    }

    .course-card {
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }
    .course-card:hover {
      transform: translateY(-3px) scale(1.015);
    }

    /* Soft ambient vignette */
    .vignette::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.45) 100%);
      z-index: 5;
    }
  </style>
</head>
<body class="vignette">
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.5/babel.min.js"></script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    // ========== SCHEDULE DATA — parsed from Engineering_Class_Schedule.xlsx ==========
    // Single source of truth. No invented courses, rooms, or times.
    const SCHEDULE_DATA = {
      academicYear: "2025-2026",
      department: "Civil & Structural Engineering Department",
      days: ["Saturday", "Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
      courses: [
        // Saturday
        { day: "Saturday", startTime: "10:00", endTime: "11:50", name: "Fluid Mechanics Lab", type: "Lab", room: null, category: "fluid", raw: "Fluid Mechanics Lab" },
        { day: "Saturday", startTime: "12:30", endTime: "14:20", name: "Introduction to Plane Surveying Lab", type: "Lab", room: null, category: "survey", raw: "introduction to Plane Surveying Lab" },
        { day: "Saturday", startTime: "14:30", endTime: "16:20", name: "Introduction to Plane Surveying", type: "Lec", room: "261", category: "survey", raw: "introduction to Plane Surveying Lec 261" },
        { day: "Saturday", startTime: "16:30", endTime: "18:20", name: "Differential Equations for Civil Engineering", type: "Lec", room: "h3", category: "math", raw: "Differential Equations for Civil Engineering Lec h3" },
        // Sunday
        { day: "Sunday", startTime: "08:00", endTime: "09:50", name: "Introduction to Plane Surveying", type: "Tut", room: "711", category: "survey", raw: "Introduction to Plane Surveying Tut 331" },
        { day: "Sunday", startTime: "14:30", endTime: "16:20", name: "Fluid Mechanics", type: "Tut", room: "331", category: "fluid", raw: "Fluid Mechanics Tut 331" },
        // Monday
        { day: "Sunday", startTime: "08:00", endTime: "09:50", name: "Differential Equations for Civil Engineering", type: "Tut", room: "202C", category: "math", raw: "Differential Equations for Civil\nEngineering Tut 202C" },
        { day: "Tuesday", startTime: "10:00", endTime: "11:50", name: "Engineering Hydrology", type: "Tut", room: "202C", category: "hydro", raw: "Engineering Hydrology Tut.202C" },
        { day: "Monday", startTime: "12:30", endTime: "15:20", name: "Structural Mechanics (1)", type: "Lec", room: "H.D", category: "struct", raw: "Structural Mechanics (1) Lec H.D" },
        // Tuesday
        { day: "Tuesday", startTime: "08:00", endTime: "09:50", name: "Engineering Hydrology", type: "Lec", room: "H.2", category: "hydro", raw: "Engineering Hydrology Lec.H.2" },
        { day: "Tuesday", startTime: "12:30", endTime: "15:20", name: "Fluid Mechanics", type: "Lec", room: "H.3", category: "fluid", raw: "Fluid Mechanics Lec.H.3" },
        // Thursday
        { day: "Thursday", startTime: "08:00", endTime: "09:50", name: "Civil Drawing", type: "Lec", room: "H.1", category: "drawing", raw: "Civil Drawing Lec.H.1" },
        { day: "Thursday", startTime: "10:00", endTime: "11:50", name: "Structures and Properties of Construction Materials", type: "Lec", room: "H.1", category: "materials", raw: "Structures and Properties of Construction Materials Lec.H.1" },
        { day: "Thursday", startTime: "12:30", endTime: "14:20", name: "Structural Mechanics (1)", type: "Tut", room: "711A", category: "struct", raw: "Structural Mechanics (1) Tut 711A" },
        { day: "Thursday", startTime: "14:30", endTime: "16:20", name: "Civil Drawing", type: "Lec/Tut", room: "711A", category: "drawing", raw: "Civil Drawing Lec.Tut 711A" },
        { day: "Thursday", startTime: "17:30", endTime: "19:20", name: "Structures and Properties of Construction Materials", type: "Tut", room: "260C", category: "materials", raw: "Structures and Properties of Construction Materials Tut 260C" },
      ]
    };

    function getTimeRange(c) {
      return `${c.startTime} — ${c.endTime}`;
    }

    function getCategoryClass(cat) {
      return ({
        struct: 'card-struct', materials: 'card-materials', lab: 'card-lab',
        math: 'card-math', survey: 'card-survey', hydro: 'card-hydro',
        fluid: 'card-fluid', drawing: 'card-drawing'
      })[cat] || 'card-struct';
    }

    function getCategoryColor(cat) {
      return ({
        struct: '#F5B642', materials: '#E8A838', lab: '#7EB8DA',
        math: '#A78BFA', survey: '#34D399', hydro: '#60A5FA',
        fluid: '#38BDF8', drawing: '#F472B6'
      })[cat] || '#F5B642';
    }

    // Subtle optional sounds
    function playClick() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = 780; o.type = 'sine';
        g.gain.setValueAtTime(0.07, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.07);
        o.start(); o.stop(ctx.currentTime + 0.07);
      } catch (_) {}
    }
    function playOn() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.setValueAtTime(180, ctx.currentTime);
        o.frequency.exponentialRampToValueAtTime(380, ctx.currentTime + 0.18);
        o.type = 'sine';
        g.gain.setValueAtTime(0.045, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.28);
        o.start(); o.stop(ctx.currentTime + 0.28);
      } catch (_) {}
    }

    // Dust particles
    function DustParticles({ active }) {
      const particles = useMemo(() => Array.from({ length: 22 }, (_, i) => ({
        id: i, left: Math.random() * 100, top: Math.random() * 100,
        delay: Math.random() * 6, size: 1 + Math.random() * 1.8
      })), []);
      if (!active) return null;
      return (
        <div className="fixed inset-0 pointer-events-none overflow-hidden z-10">
          {particles.map(p => (
            <div key={p.id} className="dust" style={{
              left: `${p.left}%`, top: `${p.top}%`,
              width: p.size, height: p.size, animationDelay: `${p.delay}s`
            }} />
          ))}
        </div>
      );
    }

    // Pull Cord
    function PullCord({ onActivate, reducedMotion }) {
      const [pullY, setPullY] = useState(0);
      const [pulling, setPulling] = useState(false);
      const [activated, setActivated] = useState(false);
      const startY = useRef(0);
      const THRESHOLD = 78;

      const doActivate = useCallback(() => {
        if (activated) return;
        setActivated(true);
        setPulling(false);
        playClick();
        setTimeout(() => playOn(), 160);
        onActivate();
      }, [activated, onActivate]);

      const handleStart = (clientY) => {
        if (activated) return;
        setPulling(true);
        startY.current = clientY;
      };

      const handleMove = (clientY) => {
        if (!pulling || activated) return;
        const delta = Math.max(0, Math.min(150, clientY - startY.current));
        setPullY(delta);
        if (delta >= THRESHOLD) doActivate();
      };

      const handleEnd = () => {
        if (activated) return;
        setPulling(false);
        setPullY(0);
      };

      useEffect(() => {
        if (!pulling) return;
        const mm = (e) => handleMove(e.clientY);
        const mu = () => handleEnd();
        window.addEventListener('mousemove', mm);
        window.addEventListener('mouseup', mu);
        return () => {
          window.removeEventListener('mousemove', mm);
          window.removeEventListener('mouseup', mu);
        };
      }, [pulling, activated]);

      return (
        <div className="relative flex flex-col items-center select-none" style={{ touchAction: 'none' }}>
          {/* Ceiling fixture */}
          <div className="w-20 h-3.5 rounded-sm bg-gradient-to-b from-gray-600 to-gray-900 shadow-lg" />
          <div className="w-1 h-7 bg-gradient-to-b from-gray-500 to-gray-800" />

          {/* Bulb */}
          <div
            className={`relative w-[4.25rem] h-[5.25rem] rounded-full bulb-glass ${activated ? 'bulb-on' : 'swing'}`}
            style={{ transformOrigin: 'top center' }}
          >
            {!activated && (
              <div className="absolute inset-0 flex items-center justify-center opacity-30">
                <div className="w-3.5 h-5 border border-gray-500 rounded-sm" />
              </div>
            )}
          </div>

          {/* Socket */}
          <div className="w-7 h-3.5 -mt-0.5 rounded-b-md bg-gradient-to-b from-gray-600 to-gray-900 z-10" />

          {/* Cord + handle */}
          <div
            className="relative flex flex-col items-center cursor-grab active:cursor-grabbing outline-none"
            style={{
              transform: `translateY(${pullY}px)`,
              transition: pulling ? 'none' : 'transform 0.45s cubic-bezier(0.34, 1.4, 0.64, 1)'
            }}
            onMouseDown={(e) => handleStart(e.clientY)}
            onTouchStart={(e) => { e.preventDefault(); handleStart(e.touches[0].clientY); }}
            onTouchMove={(e) => { e.preventDefault(); handleMove(e.touches[0].clientY); }}
            onTouchEnd={handleEnd}
            onKeyDown={(e) => {
              if ((e.key === 'Enter' || e.key === ' ') && !activated) {
                e.preventDefault();
                doActivate();
              }
            }}
            tabIndex={0}
            role="button"
            aria-label="Pull the cord to turn on the light and reveal your schedule"
          >
            <div
              className="cord w-[2px]"
              style={{ height: `${100 + pullY * 0.35}px` }}
            />
            <div className="cord-handle w-5 h-9 rounded-full flex items-center justify-center">
              <div className="w-1.5 h-1.5 rounded-full bg-gray-500" />
            </div>
          </div>

          {!activated && (
            <>
              <p className="mt-7 text-sm text-warmwhite/55 tracking-wide font-light instruction-pulse">
                Pull the cord to reveal your schedule
              </p>
              <button
                onClick={doActivate}
                className="mt-5 text-[11px] text-warmwhite/25 hover:text-warmwhite/55 transition-colors underline underline-offset-2"
                aria-label="Alternative: Turn on light"
              >
                Turn On Light
              </button>
            </>
          )}
        </div>
      );
    }

    // Course Card
    function CourseCard({ course, index }) {
      const [expanded, setExpanded] = useState(false);
      const color = getCategoryColor(course.category);

      return (
        <div
          className={`course-card relative rounded-xl bg-charcoal/85 backdrop-blur-sm border border-white/[0.06] p-3.5 md:p-4 cursor-pointer ${getCategoryClass(course.category)} fade-in-up`}
          style={{
            borderLeftColor: color,
            animationDelay: `${0.08 * index}s`,
            opacity: 0
          }}
          onClick={() => setExpanded(!expanded)}
        >
          <h3 className="text-[13px] md:text-[15px] font-semibold text-warmwhite leading-snug">
            {course.name}
          </h3>
          <div className="mt-2 flex flex-wrap items-center gap-x-3 gap-y-1.5 text-[11px] md:text-xs text-warmwhite/55">
            <span className="inline-flex items-center gap-1">
              <svg className="w-3 h-3 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
              {getTimeRange(course)}
            </span>
            {course.type && (
              <span className="px-1.5 py-0.5 rounded bg-white/[0.06] text-warmyellow/85 font-medium">
                {course.type}
              </span>
            )}
            {course.room && (
              <span className="inline-flex items-center gap-1">
                <svg className="w-3 h-3 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                {course.room}
              </span>
            )}
          </div>
          {expanded && (
            <div className="mt-2.5 pt-2.5 border-t border-white/[0.06] text-[11px] text-warmwhite/45 leading-relaxed">
              {course.raw}
            </div>
          )}
        </div>
      );
    }

    // Header
    function Header() {
      return (
        <header className="text-center py-8 md:py-12 px-4 relative z-20 fade-in-up" style={{ animationDelay: '0.15s', opacity: 0 }}>
          <p className="text-goldenamber/75 text-[11px] md:text-xs tracking-[0.28em] uppercase font-medium mb-2.5">
            Ain Shams University — Faculty of Engineering
          </p>
          <h1 className="text-3xl md:text-5xl font-bold text-warmwhite text-glow tracking-tight font-manrope">
            Civil Engineering
          </h1>
          <p className="mt-2 text-lg md:text-xl text-warmyellow/90 font-medium tracking-wide">
            Sophomore — Section 1
          </p>
          <div className="mt-3.5 flex justify-center gap-2 text-[11px] text-warmwhite/35">
            <span>Academic Year 2025-2026</span>
            <span aria-hidden="true">·</span>
            <span>Structural Engineering</span>
          </div>
        </header>
      );
    }

    // Desktop / large layout
    function DesktopSchedule() {
      return (
        <div className="hidden lg:block px-6 pb-10 max-w-5xl mx-auto">
          <div className="space-y-5">
            {SCHEDULE_DATA.days.map((day, dayIdx) => {
              const dayCourses = SCHEDULE_DATA.courses.filter(c => c.day === day);
              if (dayCourses.length === 0) return null;
              return (
                <section
                  key={day}
                  className="rounded-2xl bg-charcoal/40 border border-white/[0.04] p-5 fade-in-up"
                  style={{ animationDelay: `${0.25 + dayIdx * 0.08}s`, opacity: 0 }}
                >
                  <h2 className="text-goldenamber font-semibold text-sm tracking-wider mb-4 uppercase">
                    {day}
                  </h2>
                  <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3.5">
                    {dayCourses.map((course, i) => (
                      <CourseCard key={`${day}-${i}`} course={course} index={i} />
                    ))}
                  </div>
                </section>
              );
            })}
          </div>
        </div>
      );
    }

    // Mobile layout
    function MobileSchedule() {
      return (
        <div className="lg:hidden px-4 pb-10 space-y-7">
          {SCHEDULE_DATA.days.map((day, dayIdx) => {
            const dayCourses = SCHEDULE_DATA.courses.filter(c => c.day === day);
            if (dayCourses.length === 0) return null;
            return (
              <section
                key={day}
                className="fade-in-up"
                style={{ animationDelay: `${0.22 + dayIdx * 0.07}s`, opacity: 0 }}
              >
                <h2 className="text-goldenamber font-semibold text-base tracking-wide mb-3.5 pb-2 border-b border-goldenamber/15">
                  {day}
                </h2>
                <div className="space-y-3">
                  {dayCourses.map((course, i) => (
                    <CourseCard key={`${day}-${i}`} course={course} index={i} />
                  ))}
                </div>
              </section>
            );
          })}
        </div>
      );
    }

    // Footer
    function Footer() {
      return (
        <footer className="relative z-20 py-11 px-4 text-center border-t border-white/[0.04] mt-6 fade-in-up" style={{ animationDelay: '0.9s', opacity: 0 }}>
          <div className="max-w-md mx-auto">
            <div className="h-px w-14 bg-gradient-to-r from-transparent via-goldenamber/40 to-transparent mx-auto mb-6" />
            <p className="text-warmwhite/80 text-sm font-medium tracking-wide">
              Designed & Developed by Abdelrahman Ashraf
            </p>
            <p className="text-warmwhite/35 text-xs mt-1.5 tracking-wider">
              2401727 — Civil Engineering Student — Ain Shams University
            </p>
            <p className="mt-4 text-[10px] tracking-[0.35em] text-goldenamber/30">
              CIVIL ENGINEERING // SOPHOMORE // SECTION 01
            </p>
          </div>
        </footer>
      );
    }

    // Nav
    function Nav({ lightOn, onToggle }) {
      return (
        <nav className="fixed top-0 inset-x-0 z-50 flex justify-between items-center px-5 md:px-8 py-4 bg-gradient-to-b from-nearblack/95 to-transparent backdrop-blur-[2px]">
          <span className="text-[11px] md:text-xs text-warmwhite/40 font-medium tracking-[0.2em] uppercase">
            ASU · Eng
          </span>
          <div className="flex gap-5 text-[12px] md:text-sm">
            <a href="#schedule" className="text-warmwhite/55 hover:text-goldenamber transition-colors">Schedule</a>
            <button onClick={onToggle} className="text-warmwhite/55 hover:text-goldenamber transition-colors" aria-label="Toggle lighting">
              {lightOn ? 'Dim' : 'Light'}
            </button>
          </div>
        </nav>
      );
    }

    // App
    function App() {
      const [phase, setPhase] = useState('loading'); // loading | dark | activating | lit
      const [lightOn, setLightOn] = useState(false);
      const [reducedMotion, setReducedMotion] = useState(false);

      useEffect(() => {
        const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
        setReducedMotion(mq.matches);
        const h = (e) => setReducedMotion(e.matches);
        mq.addEventListener('change', h);
        return () => mq.removeEventListener('change', h);
      }, []);

      useEffect(() => {
        const t = setTimeout(() => setPhase('dark'), 1100);
        return () => clearTimeout(t);
      }, []);

      const handleActivate = useCallback(() => {
        setPhase('activating');
        if (reducedMotion) {
          setLightOn(true);
          setPhase('lit');
          return;
        }
        setTimeout(() => {
          setLightOn(true);
          setPhase('lit');
        }, 580);
      }, [reducedMotion]);

      const toggleLight = () => {
        if (!lightOn) {
          setLightOn(true);
          setPhase('lit');
        } else {
          setLightOn(false);
        }
      };

      return (
        <div className={`relative min-h-screen transition-colors duration-1000 ${lightOn ? 'bg-nearblack' : 'bg-black'}`}>
          {/* Warm radial bloom */}
          {lightOn && (
            <div
              className="fixed inset-0 pointer-events-none z-0 reveal-light"
              style={{
                background: 'radial-gradient(ellipse 85% 55% at 50% 12%, rgba(255,209,102,0.14) 0%, rgba(245,182,66,0.05) 42%, transparent 72%)'
              }}
            />
          )}

          {lightOn && <div className="fixed inset-0 blueprint-bg opacity-[0.35] pointer-events-none z-0" />}

          {lightOn && (
            <div className="fixed bottom-16 right-3 md:right-8 pointer-events-none z-0 opacity-[0.035] select-none">
              <p className="text-7xl md:text-8xl font-bold tracking-tighter text-warmwhite">CIVIL</p>
            </div>
          )}

          <DustParticles active={lightOn} />

          {/* Loading */}
          {phase === 'loading' && (
            <div className="fixed inset-0 z-[60] flex flex-col items-center justify-center bg-black">
              <div className="w-11 h-14 rounded-full bulb-glass pulse-glow mb-5" />
              <p className="text-warmwhite/35 text-xs tracking-[0.25em] uppercase">Preparing your schedule...</p>
            </div>
          )}

          {phase !== 'loading' && (
            <>
              <Nav lightOn={lightOn} onToggle={toggleLight} />

              {!lightOn && (
                <div className="fixed inset-0 z-30 flex flex-col items-center justify-center">
                  <PullCord onActivate={handleActivate} reducedMotion={reducedMotion} />
                </div>
              )}

              {phase === 'activating' && (
                <div className="fixed inset-0 z-40 pointer-events-none bg-black flicker" />
              )}

              {lightOn && (
                <main id="schedule" className="relative z-20 pt-16 reveal-light">
                  <Header />
                  <DesktopSchedule />
                  <MobileSchedule />
                  <Footer />
                </main>
              )}
            </>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
